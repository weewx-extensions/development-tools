name: Run analyze and test

on:
  push:
    branches-ignore: [ "master" ]
  workflow_dispatch:

jobs:
  analyze-test:
    uses: ./.github/workflows/analyze-test.yml
    with:
      module-name: 'simpleclass'
      lint-fail: true
      #pip-list: 'paho-mqtt'
      #package-list: 'mosquitto'
      unit-test: true
      function-test: false
      integration-test: false
      e2e-test: false
      #flake-extra-parms: '--exclude tests'
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      CODACY_API_TOKEN: ${{ secrets.CODACY.API_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
